name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            binary: alterione-agent
          - os: macos-latest
            target: macos-arm64
            binary: alterione-agent
          - os: windows-latest
            target: windows-x64
            binary: alterione-agent.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1

      - run: dart pub get

      - name: Compile
        run: |
          dart compile exe bin/main.dart -o ${{ matrix.binary }}

      - name: Archive
        run: |
          tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.binary }}
        if: runner.os != 'Windows'

      - name: Archive (Windows)
        run: |
          Compress-Archive -Path ${{ matrix.binary }} -DestinationPath ${{ matrix.target }}.zip
        if: runner.os == 'Windows'

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ matrix.target }}.tar.gz
            ${{ matrix.target }}.zip
