# docker-compose.yml
services:
  agent:
    image: alterione/agent:latest
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./config:/alterione/config
      - ./personas:/alterione/personas
      - ./data:/alterione/data
      - ./modules:/alterione/modules
    environment:
      - ALTERIONE_TOKEN=your_secret_token
    restart: unless-stopped
